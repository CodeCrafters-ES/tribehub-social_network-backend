openapi: 3.1.0
info:
  title: TribeHub API
  version: 0.1.0
  description: >
    TribeHub social network REST API.
    This is a placeholder spec — endpoints will be added as modules are implemented.
  contact:
    name: TribeHub Team

servers:
  - url: http://localhost:3000/api/v1
    description: Local development

security:
  - BearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '500':
          description: Service is unhealthy or an internal error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      operationId: registerUser
      summary: Register a new user account
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully. Email confirmation may be required before login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      operationId: loginUser
      summary: Authenticate with email and password
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials or email not confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate the refresh token and obtain a new access token
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Refresh token invalid, expired, or blacklisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      operationId: logoutUser
      summary: Revoke the current session and blacklist the refresh token
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Session revoked successfully
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /account/delete/request:
    post:
      operationId: requestDelete
      summary: Request account deletion
      description: Initiates the soft delete flow by generating a challenge token.
      tags:
        - Account
      security:
        - BearerAuth: []
      responses:
        '201': 
          description: Request created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleteRequestId:
                    type: string
                    format: uuid
                    example: "123e4567-e89b-12d3-a456-426614174000"
                  expiresIn:
                    type: integer
                    example: 900
        '401':
          description: Unauthorized (Invalid or missing token).

  /account/delete/confirm:
    post:
      operationId: confirmDelete
      summary: Confirm account deletion
      description: Validates the challenge and password to execute the deletion.
      tags:
        - Account
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deleteRequestId
                - password
              properties:
                deleteRequestId:
                  type: string
                  format: uuid
                password:
                  type: string
      responses:
        '200':
          description: Deletion confirmed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '400':
          description: Invalid, expired, or already processed request.
        '401':
          description: Incorrect password or unauthorized user.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: supersecret123

    RegisterResponse:
      type: object
      properties:
        message:
          type: string
          example: Registration successful. Please check your email to confirm your account.

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: supersecret123

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: "Short-lived JWT access token (Authorization: Bearer)"
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: Long-lived refresh token used to rotate the session
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Refresh token obtained at login
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code (e.g. INVALID_CREDENTIALS, USER_NOT_FOUND)
          example: INVALID_CREDENTIALS
        message:
          type: string
          description: Human-readable error description
          example: The provided credentials are incorrect
        details:
          type: array
          description: Optional list of field-level validation errors
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
