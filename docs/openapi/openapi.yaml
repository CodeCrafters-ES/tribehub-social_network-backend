openapi: 3.1.0
info:
  title: TribeHub API
  version: 0.1.0
  description: >
    TribeHub social network REST API.
    This is a placeholder spec — endpoints will be added as modules are implemented.
  contact:
    name: TribeHub Team

servers:
  - url: http://localhost:3000/api/v1
    description: Local development

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
