# .github/workflows/smoke-staging.yml
#
# Smoke test suite for the TribeHub staging environment.
#
# Triggers:
#   - Automatically on push to the `staging` branch (post-deploy gate)
#   - Manually via workflow_dispatch (for on-demand verification)
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   SMOKE_BASE_URL        — staging deployment URL (e.g. https://staging.tribehub.app)
#   SMOKE_USER_EMAIL      — smoke-test Supabase user email
#   SMOKE_USER_PASSWORD   — smoke-test Supabase user password
#
# The job fails fast if any smoke test fails, and logs the failing endpoint
# and HTTP status via Vitest's output.

name: Smoke Tests — Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Override SMOKE_BASE_URL (leave blank to use the secret)'
        required: false
        default: ''

jobs:
  smoke:
    name: Run smoke tests against staging
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || secrets.SMOKE_BASE_URL }}
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
        run: pnpm test:smoke

      - name: Report failure summary
        if: failure()
        run: |
          echo "::error::One or more smoke tests failed against staging."
          echo "::error::Check the Vitest output above for the failing endpoint and HTTP status."
          echo "::error::Use the X-Request-Id values logged to correlate with backend logs."
