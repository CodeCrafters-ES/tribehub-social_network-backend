# deploy-staging.yml
#
# Secrets required (configure in GitHub → Settings → Environments → staging):
#   RAILWAY_TOKEN         — Railway API token with deploy access
#   RAILWAY_SERVICE_ID    — ID of the Railway service to deploy
#
# Promotion to production:
#   Merge the same commit to `main`. The deploy-production workflow will run
#   on that SHA automatically, ensuring bit-for-bit promotion.
#
# Rollback:
#   Use `workflow_dispatch` on deploy-production.yml selecting the previous
#   stable SHA, or revert the merge commit on `develop` and let this workflow
#   run again.

name: Deploy — Staging

on:
  push:
    branches: [develop]

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Traceability log
        run: |
          echo "Deploying SHA ${{ github.sha }} to staging at $(date -u)"
          echo "Triggered by: ${{ github.actor }}"
          echo "Ref: ${{ github.ref }}"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (staging)
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  smoke:
    name: Smoke Tests — Staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
        run: pnpm test:smoke

      - name: Report failure summary
        if: failure()
        run: |
          echo "::error::One or more smoke tests failed against staging."
          echo "::error::Check the Vitest output above for the failing endpoint and HTTP status."
          echo "::error::Use the X-Request-Id values logged to correlate with backend logs."
